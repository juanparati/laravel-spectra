providers:
  - Spectra\SpectraServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - database/migrations

workbench:
  start: /spectra
  install: true
  discovers:
    web: true
    commands: true
    health: false
  build:
    - create-sqlite-db
    - db-wipe
    - migrate-fresh:
        --seed: true
        --seeder: Workbench\Database\Seeders\DatabaseSeeder
